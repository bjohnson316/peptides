name: Dose Reminder

# Fires several times through the evening in UTC, covering roughly 6pm-11pm Central regardless
# of DST. This is deliberately redundant: GitHub's scheduled runs can fire late (sometimes by
# hours) during busy periods, so a single trigger risks missing its window entirely. The script
# treats 6pm as "eligible from here on" rather than an exact match, and writes a same-day marker
# back to the synced data after sending — so whichever run actually happens first sends the
# email, and every later run that day (the other triggers, retries, delays) just sees the
# marker and skips cleanly. No duplicate emails, and no missed evenings from a slow run.
on:
  schedule:
    - cron: '0 23 * * *'  # ~6pm Central
    - cron: '0 0 * * *'   # ~6-7pm Central
    - cron: '0 1 * * *'   # ~7-8pm Central
    - cron: '0 2 * * *'   # ~8-9pm Central
    - cron: '0 3 * * *'   # ~9-10pm Central
    - cron: '0 4 * * *'   # ~10-11pm Central
  workflow_dispatch:
    inputs:
      force:
        description: "Send a test email right now, ignoring the time and dedup checks"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: scripts
      - run: node send-reminder.js
        working-directory: scripts
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REMINDER_TIMEZONE: America/Chicago
          REMINDER_HOUR: '18'
          FORCE: ${{ github.event.inputs.force }}
