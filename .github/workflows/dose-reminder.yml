name: Dose Reminder

# Fires twice daily in UTC — one time slot lines up with 6pm Central during
# Standard Time, the other during Daylight Time. The script itself checks the
# real local hour and only sends on the one that actually matches 6pm, so you
# never get a duplicate and never need to touch this file for DST.
on:
  schedule:
    - cron: '0 0 * * *'   # 6pm CST (UTC-6)
    - cron: '0 23 * * *'  # 6pm CDT (UTC-5)
  workflow_dispatch:
    inputs:
      force:
        description: "Send a test email right now, ignoring the time check"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: scripts
      - run: node send-reminder.js
        working-directory: scripts
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.SMTP_USER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REMINDER_TIMEZONE: America/Chicago
          REMINDER_HOUR: '18'
          FORCE: ${{ github.event.inputs.force }}
